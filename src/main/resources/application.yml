server:
  port: 8080

spring:
  application:
    name: ddd-order-service
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  # H2 控制台：http://localhost:8080/h2 ，JDBC URL: jdbc:h2:mem:orderdb
  h2:
    console:
      enabled: true
      path: /h2
      settings:
        trace: false
        web-allow-others: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      retries: 3
      retry-backoff: 1000
      batch-size: 128
      buffer-memory: 33554432
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      enable-idempotence: true
    consumer:
      group-id: order-ddd
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: true

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          inventory-client:
            connectTimeout: 2000
            readTimeout: 3000
          payment-client:
            connectTimeout: 2000
            readTimeout: 3000

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        waitDurationInOpenState: 10000

# 应用级开关
app:
  messaging:
    # 未启动 Kafka 时保持 false：Outbox 照常落库，中继跳过发送并记录日志
    kafka-enabled: false
    order-events-topic: order-events
    consumer-group: order-ddd-consumer
    consumer-enabled: false
  outbox:
    relay-enabled: true
    relay-interval-ms: 3000
    max-attempts: 5

logging:
  level:
    com.neopen.ddd.infrastructure.integration.inventory: DEBUG
    com.neopen.ddd.infrastructure.messaging: INFO
    org.apache.kafka: info
    org.springframework.kafka: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

# 防腐层调用的模拟服务地址
inventory:
  service:
    url: http://localhost:9001

payment:
  service:
    url: http://localhost:9002
